name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test -- --run
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Verify D1 schema and restore
        run: npm run test:db
      - name: Run dress rehearsal
        run: npm run rehearsal
      - name: Run authenticated Pages journey
        run: npm run test:e2e:preview
